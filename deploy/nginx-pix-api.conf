# nginx site for the PIX recovery API.
# Installed by deploy/setup_server.sh as /etc/nginx/sites-available/pix-api.conf
# (the script rewrites `api.jornadaanjo.cloud` when API_DOMAIN differs).
#
# IMPORTANT: `certbot --nginx` EDITS THIS SERVER BLOCK IN PLACE — it adds
# `listen 443 ssl`, the certificate paths and a separate port-80 server block
# that 301-redirects to https. So every directive below also applies to the TLS
# vhost, which is why the security headers live here and not in a second block.

server {
    listen 80;
    listen [::]:80;
    server_name api.jornadaanjo.cloud;

    # Webhook bodies are a few KB; nothing here uploads files.
    client_max_body_size 1m;
    client_body_timeout 15s;
    server_tokens off;

    access_log /var/log/nginx/pix-api.access.log;
    error_log  /var/log/nginx/pix-api.error.log warn;

    # Ignored by browsers over plain http; effective as soon as certbot adds TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Anti-clickjacking. The panel's CSRF defence (same-origin + nonce) is defeated
    # inside an iframe: the operator's own click submits the panel's own form with the
    # right Origin and the right nonce, and HTTP Basic credentials are cached by the
    # browser. One tricked click could switch every reminder off. The app sends the
    # same pair itself (app/deps.py FRAME_DENY_HEADERS) in case nginx is bypassed.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Let's Encrypt http-01 challenge (certbot --nginx serves it from here).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # /health is polled by check.sh and by any uptime monitor: keep it out of the log.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Every endpoint answers in milliseconds (DB only); Meta and Kirvano give up
        # long before this, so a short timeout surfaces a stuck worker fast.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

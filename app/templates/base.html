<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Jornada com Meu Anjo{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #6d4aff;
      --accent-text: #ffffff;
      --ok: #1a7f4b;
      --warn: #b45309;
      --bad: #b91c1c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; line-height: 1.5; color: var(--text); background: var(--bg);
    }
    a { color: var(--accent); }
    header.site {
      background: var(--card); border-bottom: 1px solid var(--line);
      padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center;
    }
    header.site .brand { font-weight: 700; text-decoration: none; color: var(--text); }
    header.site nav a { margin-right: 0.75rem; text-decoration: none; font-size: 0.95rem; }
    main.container { max-width: 960px; margin: 0 auto; padding: 1rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .muted { color: var(--muted); }
    .btn {
      display: inline-block; padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid var(--accent);
      background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; cursor: pointer;
    }
    .btn.secondary { background: transparent; color: var(--accent); }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.8rem; border: 1px solid var(--line); }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .badge.bad { color: var(--bad); border-color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .table-wrap { overflow-x: auto; }
    label { display: block; font-weight: 600; margin-top: 0.75rem; }
    input, select, textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .flash { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--line); }
    .flash.ok { border-color: var(--ok); }
    .flash.bad { border-color: var(--bad); }
    footer.site { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 1.5rem 1rem; }
    @media (max-width: 600px) { body { font-size: 15px; } main.container { padding: 0.75rem; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}
  <header class="site">
    <a class="brand" href="/">Jornada com Meu Anjo</a>
    {% block nav %}{% endblock %}
  </header>
  {% endblock %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block footer %}
  <footer class="site">
    Jornada com Meu Anjo · <a href="/privacidade">Política de privacidade</a>
  </footer>
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
